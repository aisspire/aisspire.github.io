<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support</title>
  <style>
    body {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
      color: #222;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 16px;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }
    a {
      color: #0969da;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .muted {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Support</h1>

  <p>
    我在业余时间维护一些开源项目。如果它们帮你节省了时间，
    可以通过下面的方式支持我。
  </p>

  <p>
    这不是义务。Star、issue、反馈 bug、改进文档，同样是很有价值的支持。
  </p>

  <div class="card">
    <h2>支持方式</h2>
    <p>
      <a href="https://aisspire.github.io/support">GitHub Sponsors</a>
    </p>
    <p class="muted">
      如果你更习惯微信或支付宝，可以扫描下面的二维码。
    </p>
  </div>

  <div class="card">
    <h2>其他支持</h2>
    <p>
      你也可以通过提交 issue、补充 README、写使用反馈来帮助项目变得更好。
    </p>
  </div>
</body>
</html>
